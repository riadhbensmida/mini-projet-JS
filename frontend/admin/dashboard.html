<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord | Admin | Bibli'Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../css/index.css?v=1.1">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        library: {
                            navy: '#0F172A',
                            indigo: '#312E81',
                            amber: '#FF4500',
                            amberLight: '#FF6347',
                            cream: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif']
                    },
                    boxShadow: {
                        'warm': '0 10px 30px -10px rgba(15, 23, 42, 0.1)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">
    <div id="sidebarContainer" style="view-transition-name: sidebar"></div>
    
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="headerContainer" style="view-transition-name: header"></div>
        
        <div class="flex-1 overflow-y-auto p-8">
            <div class="mb-8">
                <h1 class="text-2xl font-serif font-bold text-library-navy">Tableau de bord</h1>
                <p class="text-slate-500 mt-1">Vue d'ensemble de l'activité de la bibliothèque.</p>
            </div>

            <!-- Stats Grid -->
            <div id="statsGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 mb-8">
                <!-- Stats cards will be injected here -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Recent Loans -->
                <div class="bg-white rounded-xl shadow-warm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 class="text-lg font-medium text-library-navy flex items-center">
                            <svg class="w-5 h-5 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Emprunts récents
                        </h3>
                        <a href="/admin/loans.html" class="text-sm text-library-amber hover:text-library-amberLight font-bold uppercase tracking-widest">Voir tout</a>
                    </div>
                    <div id="recentLoansList" class="divide-y divide-slate-100">
                        <!-- Loans list -->
                    </div>
                </div>

                <!-- Overdue Alerts -->
                <div class="bg-white rounded-xl shadow-warm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-rose-50/30">
                        <h3 class="text-lg font-medium text-rose-900 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            Alertes retards
                        </h3>
                        <a href="/admin/loans.html" class="text-sm text-rose-600 hover:text-rose-700 font-bold uppercase tracking-widest">Gérer</a>
                    </div>
                    <div id="overdueAlertsList" class="divide-y divide-slate-100">
                        <!-- Alerts list -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        async function loadDashboardData() {
            try {
                const [books, loans, users] = await Promise.all([
                    api.books.getAll(),
                    api.loans.getAll(),
                    api.users.getAll()
                ]);

                const totalBooks = books.reduce((acc, b) => acc + parseInt(b.total_copies), 0);
                const activeLoans = loans.filter(l => l.status === 'active').length;
                const overdueLoans = loans.filter(l => l.status === 'overdue').length;
                const activeMembers = users.filter(u => u.role === 'member' && u.status === 'active').length;

                renderStats(totalBooks, activeLoans, overdueLoans, activeMembers);
                renderRecentLoans(loans, books, users);
                renderOverdueAlerts(loans, books, users);
            } catch (err) { console.error(err); }
        }

        function renderStats(totalBooks, activeLoans, overdueLoans, activeMembers) {
            const grid = document.getElementById('statsGrid');
            const stats = [
                { title: 'Total Livres', value: totalBooks, color: 'indigo', icon: '<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>' },
                { title: 'Emprunts Actifs', value: activeLoans, color: 'emerald', icon: '<path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>' },
                { title: 'En Retard', value: overdueLoans, color: 'rose', icon: '<path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>' },
                { title: 'Membres Actifs', value: activeMembers, color: 'amber', icon: '<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>' }
            ];

            grid.innerHTML = stats.map(s => `
                <div class="bg-white p-6 rounded-xl shadow-warm border border-slate-100 flex items-center transition-all hover:scale-[1.02]">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center mr-4 text-${s.color}-600 bg-${s.color}-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">${s.icon}</svg>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">${s.title}</p>
                        <p class="text-2xl font-bold text-slate-900 mt-0.5">${s.value}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderRecentLoans(loans, books, users) {
            const list = document.getElementById('recentLoansList');
            const recent = [...loans].sort((a,b) => new Date(b.borrow_date) - new Date(a.borrow_date)).slice(0, 5);
            
            if (recent.length === 0) {
                list.innerHTML = '<div class="px-6 py-8 text-center text-slate-500">Aucun emprunt récent.</div>';
                return;
            }

            list.innerHTML = recent.map(loan => {
                const book = books.find(b => b.id == loan.book_id);
                const user = users.find(u => u.id == loan.user_id);
                return `
                    <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <div>
                            <p class="text-sm font-medium text-slate-900">${book ? book.title : '?'}</p>
                            <p class="text-xs text-slate-500 mt-0.5">par ${user ? user.name : '?'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-medium text-slate-600">${new Date(loan.borrow_date).toLocaleDateString('fr-FR')}</p>
                            <span class="mt-1 inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest ${loan.status === 'active' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${loan.status === 'active' ? 'En cours' : 'Retard'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderOverdueAlerts(loans, books, users) {
            const list = document.getElementById('overdueAlertsList');
            const overdue = loans.filter(l => l.status === 'overdue')
                                 .sort((a,b) => new Date(a.due_date) - new Date(b.due_date))
                                 .slice(0, 5);

            if (overdue.length === 0) {
                list.innerHTML = '<div class="px-6 py-8 text-center text-slate-500 font-medium italic">Félicitations ! Aucun retard actuel.</div>';
                return;
            }

            list.innerHTML = overdue.map(loan => {
                const book = books.find(b => b.id == loan.book_id);
                const user = users.find(u => u.id == loan.user_id);
                const daysOverdue = Math.floor((new Date() - new Date(loan.due_date)) / (1000 * 60 * 60 * 24));

                return `
                    <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <div>
                            <p class="text-sm font-medium text-slate-900">${book ? book.title : '?'}</p>
                            <p class="text-xs text-slate-500 mt-0.5">${user ? user.name : '?'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold text-rose-600">${daysOverdue} jours</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pénalité: ${loan.penalty_amount}€</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function init() {
            try {
                const user = await api.auth.me();
                if (!user || user.role !== 'admin') { window.location.href = '/login.html'; return; }
                document.getElementById('sidebarContainer').innerHTML = components.renderSidebar(true);
                document.getElementById('headerContainer').innerHTML = components.renderHeader(user);
                loadDashboardData();
            } catch (err) { window.location.href = '/login.html'; }
        }
        init();
    </script>
</body>
</html>
