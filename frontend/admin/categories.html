<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories | Admin | Bibli'Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../css/index.css?v=1.1">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        library: {
                            navy: '#0F172A',
                            indigo: '#312E81',
                            amber: '#FF4500',
                            amberLight: '#FF6347',
                            cream: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif']
                    },
                    boxShadow: {
                        'warm': '0 10px 30px -10px rgba(15, 23, 42, 0.1)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">
    <div id="sidebarContainer" style="view-transition-name: sidebar"></div>
    
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="headerContainer" style="view-transition-name: header"></div>
        
        <div class="flex-1 overflow-y-auto p-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-serif font-bold text-library-navy">Catégories</h1>
                    <p class="text-slate-500 mt-1">Organisez les sections de la bibliothèque.</p>
                </div>
                <button onclick="openModal()" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-library-amber hover:bg-library-amberLight focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-library-amber transition-colors">
                    <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Nouvelle Catégorie
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-warm border border-slate-100 p-6">
                <div id="categoriesList" class="space-y-4">
                    <!-- Categories will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Category Modal -->
    <div id="categoryModal" class="fixed inset-0 z-50 hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
            <div class="inline-block overflow-hidden text-left align-bottom transition-all transform bg-white rounded-2xl shadow-2xl sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form id="categoryForm" class="p-8">
                    <input type="hidden" id="categoryId">
                    <h3 id="modalTitle" class="text-2xl font-serif font-bold text-library-navy mb-6">Nouvelle Catégorie</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Nom de la catégorie</label>
                            <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-library-amber focus:border-library-amber outline-none transition-all bg-slate-50">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Catégorie Parente (Optionnel)</label>
                            <select id="parent_id" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-library-amber focus:border-library-amber outline-none transition-all bg-white">
                                <option value="">Aucune (Catégorie Racine)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Description</label>
                            <textarea id="description" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-library-amber focus:border-library-amber outline-none transition-all bg-slate-50"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Couleur</label>
                                <input type="color" id="color" value="#312E81" class="w-full h-12 p-1 rounded-xl border border-slate-200 cursor-pointer bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Icône (Nom)</label>
                                <input type="text" id="icon" placeholder="FolderTree" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-library-amber focus:border-library-amber outline-none transition-all bg-slate-50">
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end gap-4">
                        <button type="button" onclick="closeModal()" class="px-6 py-3 text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors uppercase tracking-widest">Annuler</button>
                        <button type="submit" class="bg-library-navy text-white px-8 py-3 rounded-xl text-sm font-bold hover:bg-library-indigo transition-all shadow-md active:scale-95 uppercase tracking-widest">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        let allCategories = [];
        let allBooks = [];

        async function loadData() {
            try {
                const [cats, books] = await Promise.all([
                    api.categories.getAll(),
                    api.books.getAll()
                ]);
                allCategories = cats;
                allBooks = books;
                renderCategories();
                populateParentSelect();
            } catch (err) { console.error(err); }
        }

        function getBookCount(catId) {
            return allBooks.filter(b => b.category_id == catId).length;
        }

        function renderCategories() {
            const list = document.getElementById('categoriesList');
            const roots = allCategories.filter(c => !c.parent_id);
            
            list.innerHTML = roots.map(category => {
                const subs = allCategories.filter(c => c.parent_id == category.id);
                const bookCount = getBookCount(category.id);

                return `
                    <div class="border border-slate-200 rounded-lg overflow-hidden">
                        <div class="bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <div class="flex items-center">
                                <div class="w-8 h-8 rounded-md flex items-center justify-center mr-3" style="background-color: ${category.color}20; color: ${category.color}">
                                    <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                                </div>
                                <div>
                                    <h3 class="text-sm font-medium text-slate-900">${category.name}</h3>
                                    <p class="text-xs text-slate-500">${category.description || ''}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span class="text-xs font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full">
                                    ${bookCount} livres
                                </span>
                                <div class="flex space-x-1">
                                    <button onclick="editCategory('${category.id}')" class="p-1.5 text-slate-400 hover:text-library-indigo rounded-md transition-colors">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="deleteCategory('${category.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-md transition-colors">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        ${subs.length > 0 ? `
                            <div class="bg-white px-4 py-2 border-t border-slate-200">
                                <div class="pl-11 space-y-2">
                                    ${subs.map(sub => `
                                        <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                                            <div class="flex items-center">
                                                <div class="w-1.5 h-1.5 rounded-full mr-3" style="background-color: ${sub.color}"></div>
                                                <span class="text-sm text-slate-700">${sub.name}</span>
                                            </div>
                                            <div class="flex items-center space-x-4">
                                                <span class="text-xs text-slate-500">${getBookCount(sub.id)} livres</span>
                                                <div class="flex space-x-1">
                                                    <button onclick="editCategory('${sub.id}')" class="p-1 text-slate-400 hover:text-library-indigo rounded-md">
                                                        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                                    </button>
                                                    <button onclick="deleteCategory('${sub.id}')" class="p-1 text-slate-400 hover:text-rose-600 rounded-md">
                                                        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function populateParentSelect() {
            const select = document.getElementById('parent_id');
            const roots = allCategories.filter(c => !c.parent_id);
            select.innerHTML = '<option value="">Aucune (Catégorie Racine)</option>' + 
                               roots.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
        }

        function openModal(category = null) {
            const modal = document.getElementById('categoryModal');
            const form = document.getElementById('categoryForm');
            form.reset();
            document.getElementById('categoryId').value = '';
            
            if (category) {
                document.getElementById('modalTitle').textContent = 'Modifier la catégorie';
                document.getElementById('categoryId').value = category.id;
                document.getElementById('name').value = category.name;
                document.getElementById('description').value = category.description;
                document.getElementById('parent_id').value = category.parent_id || '';
                document.getElementById('color').value = category.color;
                document.getElementById('icon').value = category.icon;
            } else {
                document.getElementById('modalTitle').textContent = 'Nouvelle Catégorie';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('categoryModal').classList.add('hidden'); }

        async function editCategory(id) {
            try {
                const cat = await api.categories.getById(id);
                openModal(cat);
            } catch (err) { alert(err.message); }
        }

        async function deleteCategory(id) {
            if (!confirm('Supprimer cette catégorie ? Les sous-catégories resteront mais seront orphelines.')) return;
            try {
                await api.categories.delete(id);
                loadData();
            } catch (err) { alert(err.message); }
        }

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('categoryId').value;
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                parent_id: document.getElementById('parent_id').value || null,
                color: document.getElementById('color').value,
                icon: document.getElementById('icon').value
            };

            try {
                if (id) await api.categories.update(id, data);
                else await api.categories.create(data);
                closeModal();
                loadData();
            } catch (err) { alert(err.message); }
        });

        async function init() {
            try {
                const user = await api.auth.me();
                if (!user || user.role !== 'admin') { window.location.href = '/login.html'; return; }
                document.getElementById('sidebarContainer').innerHTML = components.renderSidebar(true);
                document.getElementById('headerContainer').innerHTML = components.renderHeader(user);
                loadData();
            } catch (err) { window.location.href = '/login.html'; }
        }
        init();
    </script>
</body>
</html>
