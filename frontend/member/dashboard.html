<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace | Bibli'Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="../css/index.css?v=1.1">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        library: {
                            navy: '#0F172A',
                            indigo: '#312E81',
                            amber: '#FF4500',
                            amberLight: '#FF6347',
                            cream: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif']
                    },
                    boxShadow: {
                        'warm': '0 10px 30px -10px rgba(15, 23, 42, 0.1)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">
    <div id="sidebarContainer" style="view-transition-name: sidebar"></div>
    
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="headerContainer" style="view-transition-name: header"></div>
        
        <div class="flex-1 overflow-y-auto p-8">
            <div class="mb-8">
                <h1 id="welcomeText" class="text-2xl font-serif font-bold text-library-navy">Bonjour, Membre</h1>
                <p class="text-slate-500 mt-1">Bienvenue dans votre espace lecteur.</p>
            </div>

            <!-- Stats Grid -->
            <div id="statsGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 mb-8">
                <!-- Stats cards will be injected here -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-6">
                    <!-- Attention Required Panel -->
                    <div id="alertPanel" class="hidden bg-rose-50 rounded-xl p-6 border border-rose-100">
                        <h3 class="text-lg font-bold text-rose-900 flex items-center mb-4 uppercase tracking-widest text-sm">
                            <svg class="w-5 h-5 mr-2 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            Attention requise
                        </h3>
                        <div id="alertsList" class="space-y-3">
                            <!-- High priority alerts -->
                        </div>
                    </div>

                    <!-- Current Loans List -->
                    <div class="bg-white rounded-xl shadow-warm border border-slate-100 overflow-hidden">
                        <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 class="text-sm font-bold text-library-navy uppercase tracking-widest flex items-center">
                                <svg class="w-5 h-5 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                Mes emprunts en cours
                            </h3>
                            <a href="/member/loans.html" class="text-xs font-bold text-library-amber hover:text-library-amberLight uppercase tracking-widest">Voir tout</a>
                        </div>
                        <div id="currentLoansList" class="divide-y divide-slate-100">
                            <!-- Loan snippets -->
                        </div>
                    </div>
                </div>

                <!-- Quick Actions / Member Card -->
                <div class="space-y-6">
                    <a href="/member/catalog.html" class="block bg-library-navy text-white rounded-xl p-8 shadow-warm hover:bg-library-indigo transition-all group active:scale-95">
                        <svg class="w-10 h-10 text-library-amber mb-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <h3 class="text-xl font-bold mb-1">Explorer le catalogue</h3>
                        <p class="text-sm text-slate-300">Découvrez de nouveaux livres à emprunter.</p>
                    </a>

                    <div class="bg-white rounded-xl p-6 shadow-warm border border-slate-100">
                        <h3 class="text-xs font-bold text-slate-400 mb-6 uppercase tracking-widest">Ma Carte Lecteur</h3>
                        <div id="memberCardContent" class="space-y-4">
                            <!-- Member card details -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        async function loadDashboardData() {
            try {
                const [user, books, loans] = await Promise.all([
                    api.auth.me(),
                    api.books.getAll(),
                    api.loans.getAll()
                ]);

                document.getElementById('welcomeText').textContent = `Bonjour, ${user.name}`;
                
                const myLoans = loans.filter(l => l.user_id == user.id);
                const active = myLoans.filter(l => l.status === 'active');
                const overdue = myLoans.filter(l => l.status === 'overdue');
                const returned = myLoans.filter(l => l.status === 'returned');
                const totalPenalty = myLoans.reduce((acc, l) => acc + (l.penalty_paid ? 0 : parseFloat(l.penalty_amount || 0)), 0);

                renderStats(active.length + overdue.length, returned.length, totalPenalty);
                renderAlerts(overdue, active, books);
                renderCurrentLoans(active, books);
                renderMemberCard(user);
            } catch (err) { console.error(err); }
        }

        function renderStats(activeCount, readCount, penalty) {
            const grid = document.getElementById('statsGrid');
            const stats = [
                { title: 'Emprunts en cours', value: activeCount, color: 'indigo', icon: '<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>' },
                { title: 'Livres lus', value: readCount, color: 'emerald', icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>' },
                { title: 'Pénalités dues', value: `${penalty}€`, color: penalty > 0 ? 'rose' : 'slate', icon: '<path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>' }
            ];

            grid.innerHTML = stats.map(s => `
                <div class="bg-white p-6 rounded-xl shadow-warm border border-slate-100 flex items-center transition-all hover:scale-105">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center mr-4 text-${s.color}-600 bg-${s.color}-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">${s.icon}</svg>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${s.title}</p>
                        <p class="text-2xl font-bold text-slate-900 mt-0.5">${s.value}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderAlerts(overdue, active, books) {
            const panel = document.getElementById('alertPanel');
            const list = document.getElementById('alertsList');
            
            const dueSoon = active.filter(l => {
                const days = Math.ceil((new Date(l.due_date) - new Date()) / (1000 * 60 * 60 * 24));
                return days >= 0 && days <= 3;
            });

            if (overdue.length === 0 && dueSoon.length === 0) {
                panel.classList.add('hidden');
                return;
            }

            panel.classList.remove('hidden');
            let html = '';

            overdue.forEach(loan => {
                const book = books.find(b => b.id == loan.book_id);
                html += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-rose-100 flex justify-between items-center">
                        <div>
                            <p class="text-sm font-bold text-slate-900">${book ? book.title : 'Livre'}</p>
                            <p class="text-xs text-rose-600 font-medium mt-0.5">En retard depuis le ${new Date(loan.due_date).toLocaleDateString('fr-FR')}</p>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700 uppercase tracking-widest">Pénalité: ${loan.penalty_amount}€</span>
                    </div>
                `;
            });

            dueSoon.forEach(loan => {
                const book = books.find(b => b.id == loan.book_id);
                const days = Math.ceil((new Date(loan.due_date) - new Date()) / (1000 * 60 * 60 * 24));
                html += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-amber-100 flex justify-between items-center">
                        <div>
                            <p class="text-sm font-bold text-slate-900">${book ? book.title : 'Livre'}</p>
                            <p class="text-xs text-amber-600 font-medium mt-0.5">À rendre dans ${days} jour${days > 1 ? 's' : ''}</p>
                        </div>
                        <a href="/member/loans.html" class="text-xs font-bold text-library-indigo hover:underline uppercase tracking-widest">Gérer</a>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function renderCurrentLoans(active, books) {
            const list = document.getElementById('currentLoansList');
            if (active.length === 0) {
                list.innerHTML = '<div class="px-6 py-8 text-center text-slate-500 font-medium">Vous n\'avez aucun emprunt en cours.</div>';
                return;
            }

            list.innerHTML = active.slice(0, 3).map(loan => {
                const book = books.find(b => b.id == loan.book_id);
                const coverUrl = book && book.cover ? (book.cover.startsWith('http') ? book.cover : `http://127.0.0.1:8000/${book.cover}`) : null;
                return `
                    <div class="px-6 py-4 flex items-center hover:bg-slate-50 transition-colors">
                        <div class="h-16 w-12 flex-shrink-0 bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                            ${coverUrl ? `<img src="${coverUrl}" alt="${book.title}" class="h-full w-full object-cover">` : ''}
                        </div>
                        <div class="ml-4 flex-1">
                            <p class="text-sm font-bold text-slate-900 line-clamp-1">${book ? book.title : 'Livre'}</p>
                            <p class="text-xs text-slate-500 mt-0.5">${book ? book.author : ''}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Retour</p>
                            <p class="text-xs font-bold text-slate-900 mt-0.5">${new Date(loan.due_date).toLocaleDateString('fr-FR')}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMemberCard(user) {
            const container = document.getElementById('memberCardContent');
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-slate-400 uppercase tracking-widest">Numéro</span>
                        <span class="text-slate-900">${user.member_number || '-'}</span>
                    </div>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-slate-400 uppercase tracking-widest">Statut</span>
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] ${user.status === 'active' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'} uppercase">
                            ${user.status === 'active' ? 'Actif' : 'Inactif'}
                        </span>
                    </div>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-slate-400 uppercase tracking-widest">Expiration</span>
                        <span class="text-slate-900">${new Date(user.membership_expiry).toLocaleDateString('fr-FR')}</span>
                    </div>
                </div>
            `;
        }

        async function init() {
            try {
                const user = await api.auth.me();
                if (!user) { window.location.href = '/login.html'; return; }
                document.getElementById('sidebarContainer').innerHTML = components.renderSidebar(false);
                document.getElementById('headerContainer').innerHTML = components.renderHeader(user);
                loadDashboardData();
            } catch (err) { window.location.href = '/login.html'; }
        }
        init();
    </script>
</body>
</html>
